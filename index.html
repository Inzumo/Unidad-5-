<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo Generacional | Fórum UPB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<style>
:root {
  --bg: #0f0f10;
  --bg-soft: #17171a;
  --text: #f4efe6;
  --text-dim: rgba(244, 239, 230, 0.55);
  --accent: #d97742;
  --accent-soft: rgba(217, 119, 66, 0.15);
  --line: rgba(244, 239, 230, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
  font-feature-settings: "ss01", "cv01";
  -webkit-font-smoothing: antialiased;
}

#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 0;
}
#canvas-container canvas { display: block; }

/* ============ GRID MAESTRO ============ */
#presentation {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 2.5rem 3.5rem;
  pointer-events: none;
}

/* ============ HEADER ============ */
.top-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 0.9rem;
}
.brand-name {
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: 0.12em;
}
.brand-sub {
  font-size: 0.7rem;
  letter-spacing: 0.35em;
  color: var(--text-dim);
  text-transform: uppercase;
}

.talk-title {
  font-size: 0.7rem;
  letter-spacing: 0.35em;
  color: var(--text-dim);
  text-transform: uppercase;
  text-align: right;
}

/* ============ SLIDES ============ */
.slides-container {
  position: relative;
  display: flex;
  align-items: center;
  padding: 2rem 0;
}

.slide {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  transform: translateY(calc(-50% + 20px));
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 0.9s cubic-bezier(0.19, 1, 0.22, 1),
    transform 0.9s cubic-bezier(0.19, 1, 0.22, 1);
}

.slide.active {
  opacity: 1;
  visibility: visible;
  transform: translateY(-50%);
}

.slide-number {
  display: inline-block;
  font-size: 0.7rem;
  color: var(--accent);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: 0.3em;
  margin-bottom: 1.8rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--accent-soft);
}

/* Layout con imagen (grid a 2 columnas) */
.slide-split {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 4.5rem;
  align-items: center;
  width: 100%;
}

.slide-texto { max-width: 720px; }

.slide-imagen {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  border-radius: 4px;
  background: var(--bg-soft);
}
.slide-imagen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.08) brightness(0.92);
  transition: opacity 1s ease, filter 1s ease;
  opacity: 0;
}
.slide.active .slide-imagen img {
  opacity: 0.85;
}
.slide-imagen::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg,
    rgba(217, 119, 66, 0.18) 0%,
    transparent 55%,
    rgba(15, 15, 16, 0.6) 100%);
  pointer-events: none;
}

/* Layout solo texto */
.slide-solo { max-width: 1100px; }

/* ============ TIPOGRAFÍA ============ */
.eyebrow {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.4em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 1.5rem;
}

h1.titulo {
  font-size: clamp(2.8rem, 5.4vw, 5.2rem);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: var(--text);
  margin-bottom: 1.8rem;
}

h2.frase {
  font-size: clamp(2rem, 3.6vw, 3.4rem);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.025em;
  margin-bottom: 1.2rem;
  color: var(--text);
}

h2.frase.destacado,
.frase-destacada {
  color: var(--accent);
}

.parrafo {
  font-size: clamp(1.2rem, 1.6vw, 1.65rem);
  line-height: 1.45;
  font-weight: 300;
  color: rgba(244, 239, 230, 0.82);
  margin-bottom: 1rem;
  letter-spacing: -0.01em;
}

.parrafo.fuerte {
  font-weight: 600;
  color: var(--accent);
}

.autor {
  display: inline-block;
  margin-top: 1.5rem;
  font-size: 0.85rem;
  letter-spacing: 0.4em;
  color: var(--text-dim);
  text-transform: uppercase;
}

/* ============ FOOTER ============ */
.bottom-bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 2rem;
  border-top: 1px solid var(--line);
  padding-top: 1rem;
}

.controls-hint {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
}

.progress-track {
  display: flex;
  gap: 4px;
  align-items: center;
}
.progress-dot {
  width: 22px;
  height: 2px;
  background: rgba(244, 239, 230, 0.15);
  transition: background 0.5s ease;
  border-radius: 2px;
}
.progress-dot.activo { background: var(--accent); }

.autor-footer {
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--text-dim);
  text-align: right;
  text-transform: uppercase;
}

/* ============ SELECTOR DE IDIOMA ============ */
.selector-idioma {
  position: fixed;
  top: 2.5rem;
  right: 3.5rem;
  z-index: 10;
  display: flex;
  gap: 6px;
  pointer-events: auto;
}

.selector-idioma button {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  transition: all 0.25s ease;
  font-family: inherit;
}

.selector-idioma button.activo {
  background: var(--accent);
  border-color: var(--accent);
}

.selector-idioma button:hover:not(.activo) {
  border-color: rgba(244, 239, 230, 0.4);
}
</style>
</head>

<script>
/* ============ DICCIONARIO DE TEXTOS ============ */
const TEXTOS_DB = {
  es: {
    slide_01_titulo: "Relevo generacional: la ventaja que nadie está aprovechando.",
    slide_01_autor: "@centrodeeventosupb",
    slide_02_texto: "¿Un gran auditorio solo para hacer grados?",
    slide_03_texto_1: "Los eventos no llegaron a la Universidad.",
    slide_03_texto_2: "La Universidad decidió encontrarse con el mundo.",
    slide_04_texto: "Academia + Industria + Ciudad",
    slide_05_texto_1: "Los eventos nunca fueron el objetivo.",
    slide_05_texto_2: "El impacto, sí.",
    slide_06_texto_1: "Un evento trae personas.",
    slide_06_texto_2: "Una comunidad trae transformación.",
    slide_07_texto: "El talento crece a la velocidad de la confianza.",
    slide_08_texto_1: "La experiencia construye el camino.",
    slide_08_texto_2: "Las nuevas generaciones descubren nuevas rutas.",
    slide_09_texto_1: "Una visión.",
    slide_09_texto_2: "Dos generaciones.",
    slide_10_texto_1: "El crecimiento no ocurre cuando una generación reemplaza a otra.",
    slide_10_texto_2: "Ocurre cuando trabajan juntas.",
    slide_11_texto_1: "Los jóvenes no son el futuro.",
    slide_11_texto_2: "Son el presente que muchas organizaciones aún no ven.",
    slide_12_texto_1: "El futuro no se hereda.",
    slide_12_texto_2: "Se construye.",
    slide_13_texto: "Memorias",
    slide_13_autor: "@centrodeeventosupb"
  },
  pt: {
    slide_01_titulo: "Revezamento geracional: a vantagem que ninguém está aproveitando.",
    slide_01_autor: "@centrodeeventosupb",
    slide_02_texto: "Um grande auditório apenas para formaturas?",
    slide_03_texto_1: "Os eventos não chegaram à Universidade.",
    slide_03_texto_2: "A Universidade decidiu se encontrar com o mundo.",
    slide_04_texto: "Academia + Indústria + Cidade",
    slide_05_texto_1: "Os eventos nunca foram o objetivo.",
    slide_05_texto_2: "O impacto, sim.",
    slide_06_texto_1: "Um evento traz pessoas.",
    slide_06_texto_2: "Uma comunidade traz transformação.",
    slide_07_texto: "O talento cresce na velocidade da confiança.",
    slide_08_texto_1: "A experiência constrói o caminho.",
    slide_08_texto_2: "As novas gerações descobrem novas rotas.",
    slide_09_texto_1: "Uma visão.",
    slide_09_texto_2: "Duas gerações.",
    slide_10_texto_1: "O crescimento não acontece quando uma geração substitui a outra.",
    slide_10_texto_2: "Acontece quando trabalham juntas.",
    slide_11_texto_1: "Os jovens não são o futuro.",
    slide_11_texto_2: "São o presente que muitas organizações ainda não veem.",
    slide_12_texto_1: "O futuro não se herda.",
    slide_12_texto_2: "Se constrói.",
    slide_13_texto: "Memórias",
    slide_13_autor: "@centrodeeventosupb"
  }
};

let idiomaActual = "es";

function aplicarTextos(idioma) {
  const textos = TEXTOS_DB[idioma] || TEXTOS_DB.es;
  document.querySelectorAll("[data-clave]").forEach(el => {
    const clave = el.dataset.clave;
    if (textos[clave] !== undefined) el.textContent = textos[clave];
  });
  document.documentElement.lang = idioma;
  idiomaActual = idioma;
}

document.querySelectorAll(".selector-idioma button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".selector-idioma button")
      .forEach(b => b.classList.remove("activo"));
    btn.classList.add("activo");
    aplicarTextos(btn.dataset.idioma);
  });
});

/* ============ SISTEMA DE PARTÍCULAS (p5.js) ============ */
const SCENE_PARAMS = [
  { rigidity: 0.20, restLength: 60,  damping: 0.85, agitation: 0.10 },  // 0 rígido
  { rigidity: 0.12, restLength: 90,  damping: 0.88, agitation: 0.5  },  // 1 fluido
  { rigidity: 0.07, restLength: 115, damping: 0.90, agitation: 1.3  },  // 2 impacto
  { rigidity: 0.04, restLength: 140, damping: 0.92, agitation: 2.4  },  // 3 fricción
  { rigidity: 0.14, restLength: 80,  damping: 0.95, agitation: 0.35 }   // 4 adaptable
];

let currentScene = 0;
let system;
let slides;
let progressTrack;

const ACCENT = [217, 119, 66];
const ACCENT_YOUNG = [244, 239, 230];

function setup() {
  const contenedor = document.getElementById('canvas-container');
  const canvas = createCanvas(windowWidth, windowHeight);
  canvas.parent(contenedor);
  pixelDensity(1);

  slides = document.querySelectorAll('.slide');
  progressTrack = document.getElementById('progress-track');

  // Crear los dots de progreso
  slides.forEach((_, i) => {
    const dot = document.createElement('span');
    dot.className = 'progress-dot' + (i === 0 ? ' activo' : '');
    progressTrack.appendChild(dot);
  });

  system = new ParticleSystem(75);
  aplicarTextos('es');
  applyScene(0);
}

function draw() {
  background(15, 15, 16, 255);
  system.update();
  system.display();
}

class ParticleSystem {
  constructor(count) {
    this.nodes = [];
    this.springs = [];
    this.k = 0.1;
    this.restLength = 100;
    this.damping = 0.9;
    this.agitation = 0.5;

    for (let i = 0; i < count; i++) {
      const isYoung = i > count * 0.55;
      const mass = isYoung ? 1 : 3.5;
      const pos = createVector(
        random(width * 0.35, width * 0.95),
        random(height * 0.15, height * 0.85)
      );
      this.nodes.push(new Node(pos.x, pos.y, mass, isYoung));
    }
    this.rebuildConnections();
  }

  setParams(p) {
    this.k = p.rigidity;
    this.restLength = p.restLength;
    this.damping = p.damping;
    this.agitation = p.agitation;
  }

  rebuildConnections() {
    this.springs = [];
    for (let i = 0; i < this.nodes.length; i++) {
      for (let j = i + 1; j < this.nodes.length; j++) {
        const d = dist(
          this.nodes[i].pos.x, this.nodes[i].pos.y,
          this.nodes[j].pos.x, this.nodes[j].pos.y
        );
        if (d < 170) this.springs.push(new Spring(this.nodes[i], this.nodes[j]));
      }
    }
  }

  update() {
    for (const node of this.nodes) {
      const rf = p5.Vector.random2D().mult(
        this.agitation * (node.isYoung ? 1.8 : 0.4)
      );
      node.applyForce(rf);

      const center = createVector(width * 0.72, height * 0.5);
      const cf = p5.Vector.sub(center, node.pos).mult(0.00018);
      node.applyForce(cf);
    }
    for (const spring of this.springs) spring.update(this.k, this.restLength);
    for (const node of this.nodes) node.update(this.damping);
  }

  display() {
    for (const spring of this.springs) spring.display();
    for (const node of this.nodes) node.display();
  }
}

class Node {
  constructor(x, y, mass, isYoung) {
    this.pos = createVector(x, y);
    this.vel = createVector(0, 0);
    this.acc = createVector(0, 0);
    this.mass = mass;
    this.isYoung = isYoung;
  }
  applyForce(force) {
    const f = p5.Vector.div(force, this.mass);
    this.acc.add(f);
  }
  update(damping) {
    this.vel.add(this.acc);
    this.vel.mult(damping);
    this.pos.add(this.vel);
    this.acc.mult(0);
    this.pos.x = constrain(this.pos.x, width * 0.32, width - 40);
    this.pos.y = constrain(this.pos.y, 50, height - 50);
  }
  display() {
    noStroke();
    if (this.isYoung) {
      fill(ACCENT_YOUNG[0], ACCENT_YOUNG[1], ACCENT_YOUNG[2], 190);
      ellipse(this.pos.x, this.pos.y, 6, 6);
    } else {
      fill(ACCENT[0], ACCENT[1], ACCENT[2], 210);
      ellipse(this.pos.x, this.pos.y, 13, 13);
    }
  }
}

class Spring {
  constructor(nodeA, nodeB) { this.a = nodeA; this.b = nodeB; }
  update(k, restLength) {
    const force = p5.Vector.sub(this.b.pos, this.a.pos);
    const d = force.mag();
    const delta = d - restLength;
    force.normalize();
    force.mult(k * delta);
    this.a.applyForce(force);
    this.b.applyForce(force.mult(-1));
  }
  display() {
    const d = p5.Vector.dist(this.a.pos, this.b.pos);
    const alpha = map(d, 20, 220, 130, 8, true);
    strokeWeight(map(d, 20, 180, 1.4, 0.35, true));
    stroke(244, 239, 230, alpha);
    line(this.a.pos.x, this.a.pos.y, this.b.pos.x, this.b.pos.y);
  }
}

/* ============ NAVEGACIÓN ============ */
function applyScene(index) {
  slides.forEach((slide, i) => {
    slide.classList.toggle('active', i === index);
  });

  // Dots de progreso
  const dots = progressTrack.querySelectorAll('.progress-dot');
  dots.forEach((d, i) => d.classList.toggle('activo', i <= index));

  // Parámetros físicos
  const sceneAttr = slides[index].getAttribute('data-scene');
  const sceneIndex = sceneAttr ? parseInt(sceneAttr, 10) : 0;
  if (system) {
    system.setParams(SCENE_PARAMS[sceneIndex]);
    system.rebuildConnections();
  }
}

function nextSlide() {
  currentScene = (currentScene + 1) % slides.length;
  applyScene(currentScene);
}
function prevSlide() {
  currentScene = (currentScene - 1 + slides.length) % slides.length;
  applyScene(currentScene);
}
