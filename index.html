<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relevo Generacional | Fórum UPB</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="selector-idioma">
    <button data-idioma="es" class="activo">ES</button>
    <button data-idioma="pt">PT</button>

    <header class="top-bar">

      <section class="slide active" data-scene="0">

        <h1 data-clave="slide_01_titulo"></h1>
        <p class="autor" data-clave="slide_01_autor"></p>
      </section>

      <section class="slide" data-scene="0">
        <span class="slide-number">02 / 13</span>
        <div class="slide-grid">
          <div class="slide-texto">
            <p class="script-quote" data-clave="slide_02_texto"></p>
          </div>
          <div class="slide-imagen">
            <img src="img/slide-02.jpg" alt="">
          </div>
        </div>
      </section>

      <section class="slide" data-scene="1">
        <span class="slide-number">03 / 13</span>
        <div class="slide-texto-centro">
          <p class="script-quote" data-clave="slide_03_texto_1"></p>
